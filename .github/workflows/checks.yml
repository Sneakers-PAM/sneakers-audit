name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  BUF_VERSION: v1.70.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.3.0

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: Sneakers-PAM/.github/.github/workflows/scrub.yml@main
    with:
      # Public Go module host that appears in go.sum.
      allowed-domains: gonum.org

  go:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_DB: audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      AUDIT_PG_DSN: postgres://audit@localhost:5432/audit?sslmode=disable
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go install checks each module against the Go checksum database.
      - name: Install the tools
        run: |
          go install "github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: License headers
        run: |
          missing=$(git ls-files '*.go' '*.proto' '*.sql' | while read -r f; do
            grep -q 'SPDX-License-Identifier: Apache-2.0' "$f" || echo "$f"
          done)
          if [ -n "$missing" ]; then
            echo "missing the Apache-2.0 header:"; echo "$missing"; exit 1
          fi

      - name: buf lint
        run: buf lint

      - name: buf breaking
        run: |
          if git cat-file -e origin/main:proto 2>/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/base" origin/main
            buf breaking --against "$RUNNER_TEMP/base"
          else
            echo "main has no proto yet; nothing to compare against"
          fi

      - name: Generated code is current
        run: |
          buf generate
          git diff --exit-code -- gen
          test -z "$(git status --porcelain -- gen)"

      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test -count=1 ./...

      - name: govulncheck
        run: govulncheck ./...
